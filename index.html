<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Drive - Levi .D inc & Fox.co (v1.24)</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #228b22;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .info-panel {
            width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <span>Levi .D inc & Fox.co</span>
        <span>LEFT/RIGHT steer, DOWN slow, double-tap DOWN = stop. Double P = Garage.</span>
    </div>

    <canvas id="gameCanvas" width="450" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const crashSound = new Audio("dragon-studio-car-crash-sound-376882.mp3");
        const engineSound = new Audio("dragon-studio-car-engine-372477.mp3");
        const bgMusic = new Audio("hauntsync-lazer-grid-80s-synthwave-walking-track-227155.mp3");
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
        const song2Music = new Audio("mondamusic-synthwave-retro-80s-491697.mp3");
        song2Music.loop = true;
        const winterMusic = new Audio("winter-track.mp3");
        winterMusic.loop = true;
        const post2000Music = new Audio("post2000-track.mp3");
        post2000Music.loop = true;

        let selectedSong = localStorage.getItem("varoomSong") || "synth";
        let song2Unlocked = false;
        let winterUnlocked = false;
        let post2000Unlocked = false;
        if ((selectedSong === "retro" && !song2Unlocked) || (selectedSong === "winter" && !winterUnlocked) || (selectedSong === "post2000" && !post2000Unlocked)) {
            selectedSong = "synth";
        }
        let musicVolume = parseInt(localStorage.getItem("varoomVolume")) || 30;
        let vhsTapes = [];
        let vhsTimers = { retro: 0, winter: 0, post2000: 0 };
        let unlockFlash = 0;
        let unlockMsg = "";

        const vhsColors = { retro: "#ffcc00", winter: "#00ffff", post2000: "#ff6600" };

        let gameStarted = false;
        let loadProgress = 0;
        let wheelAngle = 0;
        let readyToPlay = false;
        let lastT = 0;
        let introTimer = 0;
        const introDuration = 90;

        let score = 0;
        let highScore = parseInt(localStorage.getItem("varoomHighScore")) || 0;
        let paused = false;
        let gameOver = false;
        let shake = 0;
        
        let baseGameSpeed = 3.5;
        let gameSpeed = 3.5;

        let lastPTime = 0;
        let lastDownTime = 0;
        let fullStop = false;
        let devKeyBuffer = "";

        function inRect(px, py, r) {
            return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
        }

        let trafficPhase = "break";
        let trafficPhaseTimer = 0;
        const jamDuration = 600;   // 10 seconds
        const breakDuration = 600; // 10 seconds

        // Level Modes: "regular", "traffic", "getaway", "survival"
        let selectedGameMode = localStorage.getItem("varoomMode") || "regular";

        let copCars = [];
        let sirenFlashTimer = 0;

        let gas = 100;
        let tiredness = 0;
        let pulledOver = false;
        let sleeping = false;
        let brokenDown = false;
        let sleepTimer = 0;
        let breakdownTimer = 0;
        let gasStations = [];
        let nextStationScore = 500;
        let toastTimer = 0;
        let toastText = "";
        let asleepGameOver = false;

        let selectedCarSkin = parseInt(localStorage.getItem("varoomSkin")) || 0;
        let semiHits = parseInt(localStorage.getItem("varoomSemiHits")) || 0;
        let carHits = parseInt(localStorage.getItem("varoomCarHits")) || 0;
        let pinkSemiUnlocked = carHits >= 10;
        const carSkins = [
            { outer: "#8b0000", inner: "#000000", name: "Classic Red/Black" },
            { outer: "#000000", inner: "#00ff66", name: "Green & Black" },
            { outer: "#800080", inner: "#00ffff", name: "Purple & Blue" },
            { outer: "#ff3333", inner: "#cc0000", name: "Red Challenger", challenger: true },
            { outer: "#ff1493", inner: "#aaaaaa", name: "Pink Semi", pinkSemi: true }
        ];

        const road = { x: 120, width: 240, color: "#555" };
        
        const player = { 
            x: 220, 
            y: 400, 
            width: 30, 
            height: 50, 
            speed: 5.5,
            vx: 0
        };

        let obstacles = [];
        let scenery = [];
        let debris = [];
        let snow = [];
        let skidMarks = [];
        let spawnTimer = 0;
        let sceneryTimer = 0;
        let snowTimer = 0;
        let skidTimer = 0;
        let trailerOffset = 0;

        const carColors = ["#00ffff", "#ffff33", "#ff00ff", "#00ff66", "#ff9900"];
        const semiCabColors = ["#cc0000", "#003366", "#20b2aa"]; 
        const keys = { ArrowLeft: false, ArrowRight: false, ArrowDown: false };

        window.addEventListener("keydown", (e) => {
            if (["Space", "Enter", "ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp"].includes(e.code)) {
                e.preventDefault();
            }

            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;

            if (e.code === "ArrowDown" && !e.repeat) {
                let now = Date.now();
                if (now - lastDownTime < 400) {
                    fullStop = !fullStop;
                    lastDownTime = 0;
                } else {
                    lastDownTime = now;
                }
            }

            if (!gameStarted && readyToPlay && (e.code === "Space" || e.code === "Enter")) {
                gameStarted = true;
                engineSound.currentTime = 0;
                engineSound.play();
            }

            if (gameStarted && !gameOver) {
                if (e.key.toLowerCase() === 'l' || e.key.toLowerCase() === 'd') {
                    devKeyBuffer += e.key.toLowerCase();
                    if (devKeyBuffer.length > 2) {
                        devKeyBuffer = devKeyBuffer.slice(-2);
                    }
                    if (devKeyBuffer === "ld") {
                        score += 100;
                        devKeyBuffer = "";
                    }
                } else {
                    devKeyBuffer = "";
                }
            }

            if (e.code === "KeyP" && !e.repeat && gameStarted && !gameOver) {
                let now = Date.now();
                if (now - lastPTime < 400) {
                    paused = !paused;
                    lastPTime = 0;
                } else {
                    lastPTime = now;
                }
            }

            if (e.code === "KeyZ" && !e.repeat && gameStarted && !gameOver && !paused && selectedGameMode === "survival") {
                if (!pulledOver && !sleeping && !brokenDown) {
                    sleeping = true;
                    pulledOver = true;
                    sleepTimer = 0;
                    toastTimer = 90;
                    toastText = "PULLED OVER - SLEEPING...";
                }
            }

            if (gameOver && e.code === "Space") resetGame();
        });

        window.addEventListener("keyup", (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = false;
            }
        });

        function autoPause() {
            if (gameStarted && !gameOver) paused = true;
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) autoPause();
        });
        window.addEventListener("blur", autoPause);

        window.addEventListener("click", (e) => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            if (!gameStarted && readyToPlay) {
                gameStarted = true;
                engineSound.currentTime = 0;
                engineSound.play();
                return;
            }

            if (paused) {
                // Skin selections (y: 65 to 260)
                if (mouseY >= 65 && mouseY <= 260) {
                    if (mouseX >= 30 && mouseX <= 120) {
                        selectedCarSkin = 0;
                        localStorage.setItem("varoomSkin", selectedCarSkin);
                    } else if (mouseX >= 135 && mouseX <= 225) {
                        selectedCarSkin = 1;
                        localStorage.setItem("varoomSkin", selectedCarSkin);
                    } else if (mouseX >= 240 && mouseX <= 330) {
                        if (highScore >= 1000 || score >= 1000) {
                            selectedCarSkin = 2;
                            localStorage.setItem("varoomSkin", selectedCarSkin);
                        }
                    } else if (mouseX >= 345 && mouseX <= 435) {
                        if (semiHits >= 3) {
                            selectedCarSkin = 3;
                            localStorage.setItem("varoomSkin", selectedCarSkin);
                        }
                    }
                }

                // Mode selections (y: 300 to 335)
                if (mouseY >= 300 && mouseY <= 335) {
                    if (mouseX >= 42 && mouseX <= 130) {
                        selectedGameMode = "regular";
                        localStorage.setItem("varoomMode", selectedGameMode);
                    } else if (mouseX >= 134 && mouseX <= 222) {
                        selectedGameMode = "traffic";
                        localStorage.setItem("varoomMode", selectedGameMode);
                    } else if (mouseX >= 226 && mouseX <= 314) {
                        selectedGameMode = "getaway";
                        localStorage.setItem("varoomMode", selectedGameMode);
                    } else if (mouseX >= 318 && mouseX <= 406) {
                        selectedGameMode = "survival";
                        localStorage.setItem("varoomMode", selectedGameMode);
                    }
                }

                // Music sidebar (y: 345 to 495)
                if (mouseY >= 345 && mouseY <= 495 && mouseX >= 373 && mouseX <= 445) {
                    if (mouseY >= 362 && mouseY <= 384) {
                        selectedSong = "synth";
                        localStorage.setItem("varoomSong", selectedSong);
                    } else if (mouseY >= 386 && mouseY <= 408 && song2Unlocked) {
                        selectedSong = "retro";
                        localStorage.setItem("varoomSong", selectedSong);
                    } else if (mouseY >= 410 && mouseY <= 432 && winterUnlocked) {
                        selectedSong = "winter";
                        localStorage.setItem("varoomSong", selectedSong);
                    } else if (mouseY >= 434 && mouseY <= 456 && post2000Unlocked) {
                        selectedSong = "post2000";
                        localStorage.setItem("varoomSong", selectedSong);
                    } else if (mouseY >= 470 && mouseY <= 478) {
                        let vol = Math.round(((mouseX - 377) / 64) * 100);
                        musicVolume = Math.max(0, Math.min(100, vol));
                        localStorage.setItem("varoomVolume", musicVolume);
                    }
                }

                if (mouseY >= 378 && mouseY <= 458 && mouseX >= 30 && mouseX <= 365) {
                    if (pinkSemiUnlocked) {
                        selectedCarSkin = 4;
                        localStorage.setItem("varoomSkin", selectedCarSkin);
                        toastTimer = 90;
                        toastText = "PINK SEMI ACTIVE!";
                    } else {
                        toastTimer = 90;
                        toastText = "CRASH INTO 10 CARS TO UNLOCK!";
                    }
                }
            }

            if (gameOver) {
                resetGame();
            }
        });

        function triggerCrashExplosion() {
            crashSound.currentTime = 0;
            crashSound.play();
            shake = 18;
            debris = [];
            let currentSkin = carSkins[selectedCarSkin];
            for (let i = 0; i < 20; i++) {
                debris.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: Math.random() < 0.5 ? currentSkin.outer : "#ff3300",
                    size: Math.random() * 5 + 3,
                    life: 40
                });
            }
        }

        function resetGame() {
            score = 0;
            engineSound.currentTime = 0;
            engineSound.play();
            baseGameSpeed = 3.5;
            gameSpeed = 3.5;
            obstacles = [];
            scenery = [];
            debris = [];
            snow = [];
            skidMarks = [];
            vhsTapes = [];
            vhsTimers = { retro: 0, winter: 0, post2000: 0 };
            copCars = [];
            spawnTimer = 0;
            sceneryTimer = 0;
            snowTimer = 0;
            skidTimer = 0;
            trailerOffset = 0;
            player.x = 220;
            player.vx = 0;
            paused = false;
            gameOver = false;
            devKeyBuffer = "";
            trafficPhase = "break";
            trafficPhaseTimer = 0;
            fullStop = false;
            sirenFlashTimer = 0;
            gas = 100;
            tiredness = 0;
            pulledOver = false;
            sleeping = false;
            brokenDown = false;
            sleepTimer = 0;
            breakdownTimer = 0;
            gasStations = [];
            nextStationScore = 500;
            toastTimer = 0;
            toastText = "";
            asleepGameOver = false;
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
            keys.ArrowDown = false;
        }

        function drawChallengerCar(x, y, w, h) {
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(x + 2, y + 6, w - 4, h - 12);
            ctx.fillRect(x, y + 12, w, h - 24);
            ctx.fillStyle = "#111";
            ctx.fillRect(x + 8, y + 10, w - 16, 4);
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(x + w / 2 - 1, y + 4, 2, h - 8);
            ctx.fillStyle = "#87ceeb";
            ctx.fillRect(x + 5, y + 16, w - 10, 10);
            ctx.fillRect(x + 6, y + 32, w - 12, 8);
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(x, y + 12, 2, 4);
            ctx.fillRect(x + w - 2, y + 12, 2, 4);
            ctx.fillStyle = "#000";
            ctx.fillRect(x - 2, y + 8, 3, 10);
            ctx.fillRect(x + w - 1, y + 8, 3, 10);
            ctx.fillRect(x - 2, y + h - 18, 3, 10);
            ctx.fillRect(x + w - 1, y + h - 18, 3, 10);
        }

        function drawSpinningWheel(x, y, radius, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = "#111";
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#555";
            ctx.stroke();
            
            ctx.fillStyle = "#ccc";
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                ctx.rotate(Math.PI / 2);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, radius);
                ctx.stroke();
            }
            ctx.restore();
        }

        function playBg() {
            let track = bgMusic;
            if (selectedSong === "winter" && winterUnlocked) {
                track = winterMusic;
            } else if (selectedSong === "post2000" && post2000Unlocked) {
                track = post2000Music;
            } else if (selectedSong === "retro" && song2Unlocked) {
                track = song2Music;
            }
            track.volume = musicVolume / 100;
            for (let m of [bgMusic, song2Music, winterMusic, post2000Music]) {
                if (m !== track) m.pause();
            }
            if (track.paused) track.play();
        }

        function pauseBg() {
            for (let m of [bgMusic, song2Music, winterMusic, post2000Music]) m.pause();
        }

        function update(delta) {
            let dt = delta * 60;
            if (gameStarted && !paused && !gameOver) {
                playBg();
            } else {
                pauseBg();
            }
            let season = score >= 1000 && score < 2000 ? "winter" : "normal";
            if (!gameStarted) {
                wheelAngle += 0.12 * dt;
                if (introTimer < introDuration) {
                    introTimer += dt;
                } else if (!readyToPlay) {
                    loadProgress += 1.2 * dt;
                    if (loadProgress >= 100) {
                        loadProgress = 100;
                        readyToPlay = true;
                    }
                }
                return;
            }

            if (paused || gameOver) {
                for (let i = debris.length - 1; i >= 0; i--) {
                    debris[i].x += debris[i].vx * dt;
                    debris[i].y += debris[i].vy * dt;
                    debris[i].life -= dt;
                    if (debris[i].life <= 0) debris.splice(i, 1);
                }
                return;
            }

            sirenFlashTimer += dt;

            if (selectedGameMode === "traffic") {
                trafficPhaseTimer += dt;
                if (trafficPhase === "jam") {
                    if (trafficPhaseTimer >= jamDuration) {
                        trafficPhase = "break";
                        trafficPhaseTimer = 0;
                    }
                } else {
                    if (trafficPhaseTimer >= breakDuration) {
                        trafficPhase = "jam";
                        trafficPhaseTimer = 0;
                    }
                }
            }

            let targetSpeed = baseGameSpeed;
            if (pulledOver) {
                targetSpeed = 0;
            } else if (fullStop) {
                targetSpeed = 0;
            } else if (keys.ArrowDown) {
                targetSpeed = baseGameSpeed * 0.45;
            }
            gameSpeed += (targetSpeed - gameSpeed) * (1 - Math.pow(0.8, dt));

            let grip = season === "winter" ? 1.0 : 0.15;
            let targetVx = 0;
            if (!pulledOver) {
                if (keys.ArrowLeft && player.x > road.x + 5) targetVx = -player.speed;
                if (keys.ArrowRight && player.x < road.x + road.width - player.width - 5) targetVx = player.speed;
            }
            player.vx += (targetVx - player.vx) * grip;
            player.x += player.vx * dt;

            if (player.x < road.x + 5) {
                player.x = road.x + 5;
                player.vx = 0;
            }
            if (player.x > road.x + road.width - player.width - 5) {
                player.x = road.x + road.width - player.width - 5;
                player.vx = 0;
            }

            if (Math.abs(player.vx) > 1.5 && gameSpeed > 0.5 && !pulledOver) {
                skidTimer += dt;
                if (skidTimer > 3) {
                    skidMarks.push({
                        y: player.y + player.height - 4,
                        left: player.x + 4,
                        right: player.x + player.width - 7,
                        life: 180
                    });
                    skidTimer = 0;
                }
            } else {
                skidTimer = 0;
            }

            if (selectedCarSkin === 4) {
                let targetTrailer = player.vx * 5;
                trailerOffset += (targetTrailer - trailerOffset) * (1 - Math.pow(0.82, dt));
            } else {
                trailerOffset = 0;
            }

            if (selectedGameMode === "survival") {
                if (!pulledOver && !brokenDown) {
                    gas -= 0.018 * dt;
                    if (gas <= 0) {
                        gas = 0;
                        brokenDown = true;
                        breakdownTimer = 0;
                        pulledOver = true;
                        toastTimer = 120;
                        toastText = "OUT OF GAS!";
                    }
                }

                if (!sleeping && !brokenDown) {
                    tiredness += 0.013 * dt;
                    if (tiredness >= 100) {
                        tiredness = 100;
                        asleepGameOver = true;
                        gameOver = true;
                        triggerCrashExplosion();
                    }
                }

                if (pulledOver) {
                    let leftEdge = road.x + 5;
                    let rightEdge = road.x + road.width - player.width - 5;
                    let target = player.x < road.x + road.width / 2 ? leftEdge : rightEdge;
                    player.x += (target - player.x) * (1 - Math.pow(0.9, dt));
                    player.vx = 0;

                    if (sleeping) {
                        sleepTimer += dt;
                        tiredness = Math.max(0, tiredness - 0.8 * dt);
                        if (sleepTimer >= 1200) {
                            sleeping = false;
                            pulledOver = false;
                            tiredness = 0;
                            spawnTimer = 0;
                            toastTimer = 90;
                            toastText = "WAKE UP!";
                        }
                    } else if (brokenDown) {
                        breakdownTimer += dt;
                        if (breakdownTimer >= 600) {
                            brokenDown = false;
                            pulledOver = false;
                            gas = 25;
                            spawnTimer = 0;
                            toastTimer = 90;
                            toastText = "AUTO-FIXED! RESERVE GAS";
                        }
                    }
                }

                if (score >= nextStationScore) {
                    gasStations.push({ x: road.x + Math.random() * (road.width - 34), y: -40 });
                    nextStationScore += 500;
                }

                for (let i = gasStations.length - 1; i >= 0; i--) {
                    let st = gasStations[i];
                    st.y += gameSpeed * dt;
                    if (
                        player.x < st.x + 34 &&
                        player.x + player.width > st.x &&
                        player.y < st.y + 30 &&
                        player.y + player.height > st.y
                    ) {
                        gas = 100;
                        gasStations.splice(i, 1);
                        toastTimer = 90;
                        toastText = "REFUELED!";
                        continue;
                    }
                    if (st.y > canvas.height + 40) gasStations.splice(i, 1);
                }
            }

            if (!fullStop) spawnTimer += dt;
            let dynamicSpawnRate = 90;
            if (selectedGameMode === "traffic" && trafficPhase === "jam") {
                dynamicSpawnRate = 18;
            } else if (selectedGameMode === "getaway") {
                dynamicSpawnRate = 50; 
            }

            if (!pulledOver && !fullStop && spawnTimer > dynamicSpawnRate) {
                let isSemi = (selectedGameMode === "traffic" && trafficPhase === "jam") ? (Math.random() < 0.35) : (Math.random() < 0.10);
                let obsWidth = isSemi ? 40 : 30;
                let obsHeight = isSemi ? 115 : 50;
                
                let maxAttempts = 10;
                let placed = false;
                let x = road.x;

                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    let testX = road.x + Math.random() * (road.width - obsWidth);
                    let collision = false;

                    for (let obs of obstacles) {
                        if (obs.y < obsHeight + 20) {
                            if (
                                testX < obs.x + obs.width &&
                                testX + obsWidth > obs.x &&
                                -obsHeight < obs.y + obs.height &&
                                0 > obs.y
                            ) {
                                collision = true;
                                break;
                            }
                        }
                    }

                    if (!collision) {
                        x = testX;
                        placed = true;
                        break;
                    }
                }

                if (placed) {
                    let obstacle = { 
                        x: x, 
                        y: -obsHeight, 
                        width: obsWidth, 
                        height: obsHeight, 
                        isSemi: isSemi 
                    };

                    if (isSemi) {
                        let cabPool = pinkSemiUnlocked ? ["#cc0000", "#003366", "#20b2aa", "#ff1493"] : ["#cc0000", "#003366", "#20b2aa"];
                        obstacle.cabColor = cabPool[Math.floor(Math.random() * cabPool.length)];
                    } else {
                        obstacle.color = carColors[Math.floor(Math.random() * carColors.length)];
                    }

                    obstacles.push(obstacle);
                    spawnTimer = 0;
                }
            }

            if (selectedGameMode === "getaway") {
                if (copCars.length < 2 && Math.random() < 0.02 * dt) {
                    let copWidth = 30;
                    let copHeight = 50;
                    let copX = road.x + Math.random() * (road.width - copWidth);
                    copCars.push({
                        x: copX,
                        y: -80 - Math.random() * 100,
                        width: copWidth,
                        height: copHeight,
                        speedOffset: 0.8
                    });
                }

                for (let i = copCars.length - 1; i >= 0; i--) {
                    let cop = copCars[i];
                    if (cop.x < player.x) cop.x += 1.0 * dt;
                    if (cop.x > player.x) cop.x -= 1.0 * dt;

                    if (cop.x < road.x + 5) cop.x = road.x + 5;
                    if (cop.x > road.x + road.width - cop.width - 5) cop.x = road.x + road.width - cop.width - 5;

                    cop.y += gameSpeed * cop.speedOffset * dt;

                    if (
                        player.x < cop.x + cop.width &&
                        player.x + player.width > cop.x &&
                        player.y < cop.y + cop.height &&
                        player.y + player.height > cop.y
                    ) {
                        gameOver = true;
                        triggerCrashExplosion();
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem("varoomHighScore", highScore);
                        }
                    }

                    if (cop.y > canvas.height) {
                        copCars.splice(i, 1);
                    }
                }
            }

            if (!fullStop) sceneryTimer += dt;
            if (!pulledOver && !fullStop && sceneryTimer > 30) {
                let side = Math.random() < 0.5 ? "left" : "right";
                let x = side === "left" ? 25 + Math.random() * 65 : road.x + road.width + 25 + Math.random() * 55;
                scenery.push({ x: x, y: -40, size: 24 });
                sceneryTimer = 0;
            }

            for (let i = scenery.length - 1; i >= 0; i--) {
                scenery[i].y += gameSpeed * dt;
                if (scenery[i].y > canvas.height + 40) {
                    scenery.splice(i, 1);
                }
            }

            for (let i = skidMarks.length - 1; i >= 0; i--) {
                let mark = skidMarks[i];
                mark.y += gameSpeed * dt;
                mark.life -= dt;
                if (mark.life <= 0 || mark.y > canvas.height + 10) skidMarks.splice(i, 1);
            }

            if (season === "winter") {
                snowTimer += dt;
                if (snowTimer > 8) {
                    snow.push({
                        x: Math.random() * canvas.width,
                        y: -10,
                        size: Math.random() * 3 + 2,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: Math.random() * 2 + 1.5
                    });
                    snowTimer = 0;
                }

                for (let i = snow.length - 1; i >= 0; i--) {
                    let flake = snow[i];
                    flake.x += flake.vx * dt;
                    flake.y += (flake.vy + gameSpeed * 0.3) * dt;
                    if (flake.y > canvas.height + 10) snow.splice(i, 1);
                }
            }

            if (season !== "winter" && snow.length > 0) {
                snow = [];
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed * dt;

                if (
                    !pulledOver &&
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    if (obstacles[i].isSemi) {
                        semiHits++;
                        localStorage.setItem("varoomSemiHits", semiHits);
                    } else {
                        carHits++;
                        localStorage.setItem("varoomCarHits", carHits);
                        if (carHits >= 10 && !pinkSemiUnlocked) {
                            pinkSemiUnlocked = true;
                            unlockMsg = "BRIGHT PINK SEMI UNLOCKED!";
                            unlockFlash = 90;
                        }
                    }
                    gameOver = true;
                    triggerCrashExplosion();
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("varoomHighScore", highScore);
                    }
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }

            for (let t of ["retro", "winter", "post2000"]) {
                let gate = (t === "retro" && score >= 500) || (t === "winter" && score >= 1000) || (t === "post2000" && score >= 2000);
                if (!gate) continue;
                let need = (t === "retro" && !song2Unlocked) || (t === "winter" && !winterUnlocked) || (t === "post2000" && !post2000Unlocked);
                if (need && !pulledOver && !fullStop) {
                    vhsTimers[t] += dt;
                    if (vhsTimers[t] > 350) {
                        vhsTapes.push({ x: road.x + Math.random() * (road.width - 20), y: -14, type: t });
                        vhsTimers[t] = 0;
                    }
                }
            }

            for (let i = vhsTapes.length - 1; i >= 0; i--) {
                let tape = vhsTapes[i];
                tape.y += gameSpeed * dt;

                if (
                    player.x < tape.x + 20 &&
                    player.x + player.width > tape.x &&
                    player.y < tape.y + 14 &&
                    player.y + player.height > tape.y
                ) {
                    if (tape.type === "retro") {
                        song2Unlocked = true;
                        selectedSong = "retro";
                        unlockMsg = "RETRO SONG UNLOCKED!";
                    } else if (tape.type === "winter") {
                        winterUnlocked = true;
                        selectedSong = "winter";
                        unlockMsg = "WINTER SONG UNLOCKED!";
                    } else {
                        post2000Unlocked = true;
                        selectedSong = "post2000";
                        unlockMsg = "POST-2000 SONG UNLOCKED!";
                    }
                    unlockFlash = 90;
                    vhsTapes.splice(i, 1);
                    playBg();
                    continue;
                }

                if (tape.y > canvas.height + 20) {
                    vhsTapes.splice(i, 1);
                }
            }

            if (unlockFlash > 0) unlockFlash -= dt;
            if (toastTimer > 0) toastTimer -= dt;

            let blockIndex = Math.floor(score / 500);
            if (blockIndex % 2 === 1) {
                baseGameSpeed = 4.5 + Math.floor((score % 500) / 70);
            } else {
                baseGameSpeed = 3.5 + Math.floor((score % 500) / 70);
            }
        }

        function draw() {
            let cycleIndex = Math.floor(score / 500);
            let isNight = (cycleIndex % 2 === 1);
            let isWinter = score >= 1000 && score < 2000;
            let currentSkin = carSkins[selectedCarSkin];

            if (shake > 0) {
                ctx.save();
                ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
            }

            let bgDay = isWinter ? "#a5c9d6" : "#228b22";
            let bgNight = isWinter ? "#16222e" : "#0d2b0d";
            ctx.fillStyle = isNight ? bgNight : bgDay;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 0, 120, canvas.height);
            ctx.fillRect(road.x + road.width, 0, canvas.width - (road.x + road.width), canvas.height);

            for (let tree of scenery) {
                ctx.fillStyle = isNight ? "#38241b" : "#5c4033";
                ctx.fillRect(tree.x + 8, tree.y + 12, 8, 12);
                ctx.fillStyle = isWinter ? "#eaf4f8" : (isNight ? "#002b00" : "#004d00");
                ctx.beginPath();
                ctx.moveTo(tree.x + 12, tree.y);
                ctx.lineTo(tree.x, tree.y + 16);
                ctx.lineTo(tree.x + 24, tree.y + 16);
                ctx.closePath();
                ctx.fill();
                if (isWinter) {
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.moveTo(tree.x + 12, tree.y);
                    ctx.lineTo(tree.x + 5, tree.y + 7);
                    ctx.lineTo(tree.x + 19, tree.y + 7);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            let roadDay = isWinter ? "#98a6ad" : road.color;
            let roadNight = isWinter ? "#3a4a52" : "#2e2e2e";
            ctx.fillStyle = isNight ? roadNight : roadDay;
            ctx.fillRect(road.x, 0, road.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(road.x, 0, 4, canvas.height);
            ctx.fillRect(road.x + road.width - 4, 0, 4, canvas.height);

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(road.x + road.width / 2, 0);
            ctx.lineTo(road.x + road.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let st of gasStations) {
                ctx.fillStyle = "rgba(0, 100, 200, 0.35)";
                ctx.fillRect(st.x, st.y, 34, 30);
                ctx.strokeStyle = "#33ccff";
                ctx.lineWidth = 2;
                ctx.strokeRect(st.x, st.y, 34, 30);
                ctx.fillStyle = "#33ccff";
                ctx.font = "bold 8px monospace";
                ctx.fillText("GAS", st.x + 17 - 10, st.y + 18);
                ctx.fillStyle = "#ffff33";
                ctx.fillRect(st.x + 5, st.y + 22, 24, 4);
            }

            for (let mark of skidMarks) {
                let alpha = Math.max(0, mark.life / 180) * 0.4;
                ctx.fillStyle = "rgba(0,0,0," + alpha.toFixed(2) + ")";
                ctx.fillRect(mark.left, mark.y, 3, 5);
                ctx.fillRect(mark.right, mark.y, 3, 5);
            }

            if (isNight) {
                ctx.fillStyle = "rgba(255, 255, 150, 0.15)";
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x - 40, player.y - 120);
                ctx.lineTo(player.x + player.width + 40, player.y - 120);
                ctx.lineTo(player.x + player.width, player.y);
                ctx.closePath();
                ctx.fill();
            }

            if (!gameOver || debris.length > 10) {
                if (currentSkin.challenger) {
                    drawChallengerCar(player.x, player.y, player.width, player.height);
                } else if (selectedCarSkin === 4) {
                    let pw = 40, ph = 115;
                    let px = player.x + player.width / 2 - pw / 2;
                    let py = player.y + player.height - ph;
                    let toe = Math.round(trailerOffset);
                    ctx.fillStyle = "#ff1493";
                    ctx.fillRect(px, py, pw, 30);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(px + 5, py + 8, pw - 10, 8);
                    ctx.fillStyle = "#0066ff";
                    ctx.fillRect(px + 4, py + 2, 4, 6);
                    ctx.fillRect(px + 4, py + 18, 4, 10);
                    ctx.fillRect(px + pw - 8, py + 2, 4, 6);
                    ctx.fillRect(px + pw - 8, py + 18, 4, 10);
                    ctx.save();
                    ctx.translate(px + pw / 2, py + 30);
                    ctx.rotate(10 * Math.PI / 180);
                    ctx.fillStyle = "#aaaaaa";
                    ctx.fillRect(-pw / 2 + 3 + toe, 0, pw - 6, ph - 30);
                    ctx.fillStyle = "#777777";
                    ctx.fillRect(-pw / 2 + 3 + toe, 20, pw - 6, 4);
                    ctx.fillRect(-pw / 2 + 3 + toe, 55, pw - 6, 4);
                    ctx.restore();
                } else {
                    ctx.fillStyle = currentSkin.outer;
                    ctx.fillRect(player.x, player.y, 3, player.height); 
                    ctx.fillRect(player.x + player.width - 3, player.y, 3, player.height); 
                    
                    ctx.fillStyle = currentSkin.inner;
                    ctx.fillRect(player.x + 3, player.y, player.width - 6, player.height);
                    
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(player.x + 6, player.y + 10, player.width - 12, 8);
                }

                if ((keys.ArrowDown || fullStop) && gameStarted && !paused && !gameOver) {
                    ctx.fillStyle = "#ff0000";
                    ctx.fillRect(player.x + 3, player.y + player.height - 3, 5, 3);
                    ctx.fillRect(player.x + player.width - 8, player.y + player.height - 3, 5, 3);
                }
            }

            for (let p of debris) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }

            for (let obs of obstacles) {
                if (obs.isSemi) {
                    ctx.fillStyle = obs.cabColor;
                    ctx.fillRect(obs.x, obs.y, obs.width, 30);

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(obs.x + 5, obs.y + 8, obs.width - 10, 8);

                    if (obs.cabColor === "#ff1493") {
                        ctx.fillStyle = "#0066ff";
                        ctx.fillRect(obs.x + 4, obs.y + 2, 4, 6);
                        ctx.fillRect(obs.x + 4, obs.y + 18, 4, 10);
                        ctx.fillRect(obs.x + obs.width - 8, obs.y + 2, 4, 6);
                        ctx.fillRect(obs.x + obs.width - 8, obs.y + 18, 4, 10);
                    }

                    ctx.fillStyle = "#aaaaaa";
                    ctx.fillRect(obs.x + 3, obs.y + 30, obs.width - 6, obs.height - 30);
                    ctx.fillStyle = "#777777";
                    ctx.fillRect(obs.x + 3, obs.y + 50, obs.width - 6, 4);
                    ctx.fillRect(obs.x + 3, obs.y + 85, obs.width - 6, 4);
                } else {
                    ctx.fillStyle = obs.color;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(obs.x + 5, obs.y + 10, obs.width - 10, 8);
                }
            }

            if (selectedGameMode === "getaway") {
                for (let cop of copCars) {
                    ctx.fillStyle = "#000000";
                    ctx.fillRect(cop.x, cop.y, cop.width, 10);
                    ctx.fillRect(cop.x, cop.y + cop.height - 10, cop.width, 10);

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(cop.x, cop.y + 10, cop.width, cop.height - 20);

                    ctx.fillStyle = "#888888";
                    ctx.fillRect(cop.x + 3, cop.y + 12, cop.width - 6, 4);

                    let flash = Math.floor(sirenFlashTimer / 8) % 2 === 0;
                    ctx.fillStyle = flash ? "#ff0000" : "#0000ff";
                    ctx.fillRect(cop.x + 6, cop.y + 22, 6, 6);
                    ctx.fillStyle = flash ? "#0000ff" : "#ff0000";
                    ctx.fillRect(cop.x + cop.width - 12, cop.y + 22, 6, 6);
                }
            }

            if (sleeping) {
                ctx.fillStyle = "#aaeeff";
                ctx.font = "bold 16px monospace";
                ctx.fillText("Z", player.x + player.width / 2 + 8, player.y - 6);
                ctx.font = "bold 11px monospace";
                ctx.fillText("z", player.x + player.width / 2 + 20, player.y - 14);
                ctx.font = "bold 8px monospace";
                ctx.fillText("z", player.x + player.width / 2 + 27, player.y - 20);
            }

            if (brokenDown) {
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 10px monospace";
                ctx.fillText("BROKEN DOWN!", player.x + player.width / 2 - 28, player.y - 8);
            }

            for (let tape of vhsTapes) {
                ctx.fillStyle = "#111111";
                ctx.fillRect(tape.x, tape.y, 20, 14);
                ctx.fillStyle = "#dddddd";
                ctx.fillRect(tape.x + 2, tape.y + 2, 16, 5);
                ctx.fillStyle = vhsColors[tape.type];
                ctx.fillRect(tape.x + 4, tape.y + 4, 12, 3);
            }

            for (let flake of snow) {
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                ctx.fill();
            }

            if (isNight) {
                ctx.fillStyle = "rgba(255, 255, 0, 0.8)";
                ctx.font = "bold 11px monospace";
                ctx.fillText("NIGHT MODE", 22, 180);
            } else {
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                ctx.font = "bold 11px monospace";
                ctx.fillText("DAY MODE", 29, 180);
            }

            if (isWinter) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px monospace";
                ctx.fillText("WINTER MODE", 22, 196);
            }

            if (selectedGameMode === "traffic") {
                let secondsRemaining = Math.ceil(((trafficPhase === "jam" ? jamDuration : breakDuration) - trafficPhaseTimer) / 60);
                if (trafficPhase === "jam") {
                    ctx.fillStyle = "#ff0055";
                    ctx.font = "bold 12px monospace";
                    ctx.fillText("TRAFFIC JAM!", 15, 210);
                    ctx.fillStyle = "#ffff33";
                    ctx.fillText("(" + secondsRemaining + "s left)", 15, 228);
                } else {
                    ctx.fillStyle = "#00ff66";
                    ctx.font = "bold 12px monospace";
                    ctx.fillText("ROAD CLEAR", 15, 210);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText("(" + secondsRemaining + "s left)", 15, 228);
                }
            } else if (selectedGameMode === "getaway") {
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 12px monospace";
                ctx.fillText("GETAWAY MODE", 15, 210);
                ctx.fillStyle = "#ffffff";
                ctx.fillText("EVADE THE COPS!", 15, 228);
            } else if (selectedGameMode === "survival") {
                ctx.fillStyle = "#33ccff";
                ctx.font = "bold 12px monospace";
                ctx.fillText("SURVIVAL MODE", 15, 210);
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px monospace";
                ctx.fillText("MANAGE GAS + TIREDNESS", 15, 228);
                ctx.fillText("Z = PULL OVER", 15, 244);
            }

            if (unlockFlash > 0) {
                ctx.fillStyle = "#ffff33";
                ctx.font = "bold 14px monospace";
                ctx.textAlign = "center";
                ctx.fillText(unlockMsg, canvas.width / 2, 95);
                ctx.font = "bold 10px monospace";
                ctx.fillText("NEW SONG IN GARAGE", canvas.width / 2, 112);
                ctx.textAlign = "left";
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px monospace";
            ctx.fillText("SCORE:", 15, 270);
            ctx.fillStyle = "#00ff66";
            ctx.font = "bold 15px monospace";
            ctx.fillText(score, 15, 290);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px monospace";
            ctx.fillText("HIGH SCORE:", 15, 340);
            ctx.fillStyle = "#ffff33";
            ctx.font = "bold 15px monospace";
            ctx.fillText(highScore, 15, 360);

            if (selectedGameMode === "survival") {
                ctx.font = "bold 10px monospace";
                ctx.fillStyle = "#33ccff";
                ctx.fillText("GAS", 15, 392);
                ctx.fillStyle = "#333333";
                ctx.fillRect(15, 398, 70, 8);
                ctx.fillStyle = gas > 30 ? "#33ff66" : "#ff3333";
                ctx.fillRect(15, 398, 70 * gas / 100, 8);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1;
                ctx.strokeRect(15, 398, 70, 8);

                ctx.fillStyle = "#ffff66";
                ctx.fillText("TIRED", 15, 424);
                ctx.fillStyle = "#333333";
                ctx.fillRect(15, 430, 70, 8);
                ctx.fillStyle = tiredness > 60 ? "#ff6600" : "#ffcc00";
                ctx.fillRect(15, 430, 70 * tiredness / 100, 8);
                ctx.strokeStyle = "#ffffff";
                ctx.strokeRect(15, 430, 70, 8);
                if (tiredness >= 50) {
                    ctx.fillStyle = "#ffaa00";
                    ctx.fillText("GETTING SLEEPY!", 92, 418);
                }
            }

            if (toastTimer > 0) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(15, 452, 220, 20);
                ctx.fillStyle = "#ffff33";
                ctx.font = "bold 10px monospace";
                ctx.fillText(toastText, 20, 466);
            }

            if (!gameStarted) {
                ctx.fillStyle = "rgba(0,0,0,0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00ffff";
                ctx.font = "bold 18px monospace";
                ctx.textAlign = "center";
                ctx.fillText("Get ready to go VAROOM!", canvas.width / 2, canvas.height / 2 - 60);

                drawSpinningWheel(canvas.width / 2, canvas.height / 2 - 10, 26, wheelAngle);

                if (introTimer >= introDuration) {
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(canvas.width / 2 - 100, canvas.height / 2 + 35, 200, 16);

                    ctx.fillStyle = "#00ff66";
                    ctx.fillRect(canvas.width / 2 - 98, canvas.height / 2 + 37, (196 * (loadProgress / 100)), 12);

                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 12px monospace";
                    if (!readyToPlay) {
                        ctx.fillText("LOADING " + Math.floor(loadProgress) + "%", canvas.width / 2, canvas.height / 2 + 75);
                    } else {
                    ctx.fillStyle = "#ffff33";
                    ctx.fillText("CLICK OR PRESS SPACE TO START", canvas.width / 2, canvas.height / 2 + 75);
                    }
                }
                ctx.textAlign = "left";
            }

            if (paused) {
                ctx.fillStyle = "rgba(0,0,0,0.88)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00ffff";
                ctx.font = "bold 20px monospace";
                ctx.textAlign = "center";
                ctx.fillText("PAUSED - GARAGE", canvas.width / 2, 35);

                ctx.fillStyle = "#fff";
                ctx.font = "11px monospace";
                ctx.fillText("Pick Paint Job:", canvas.width / 2, 55);

                let boxX = 30;
                let boxY = 65;
                let boxWidth = 90;
                let boxHeight = 195;

                for (let i = 0; i < carSkins.length; i++) {
                    let skin = carSkins[i];
                    let isUnlocked = i < 2 ? true : (i === 2 ? (highScore >= 1000 || score >= 1000) : (semiHits >= 3));
                    let isSelected = (selectedCarSkin === i);

                    ctx.fillStyle = isSelected ? "#222" : "#161616";
                    ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
                    ctx.strokeStyle = isSelected ? "#00ff66" : "#555";
                    ctx.lineWidth = isSelected ? 3 : 1;
                    ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

                    let previewCarX = boxX + boxWidth / 2 - 15;
                    let previewCarY = boxY + 20;

                    if (isUnlocked) {
                        if (skin.challenger) {
                            drawChallengerCar(previewCarX, previewCarY, 30, 45);
                        } else {
                            ctx.fillStyle = skin.outer;
                            ctx.fillRect(previewCarX, previewCarY, 3, 45);
                            ctx.fillRect(previewCarX + 27, previewCarY, 3, 45);
                            ctx.fillStyle = skin.inner;
                            ctx.fillRect(previewCarX + 3, previewCarY, 24, 45);
                            ctx.fillStyle = "#fff";
                            ctx.fillRect(previewCarX + 6, previewCarY + 8, 18, 6);
                        }

                        ctx.fillStyle = "#00ff66";
                        ctx.font = "bold 10px monospace";
                        ctx.fillText(isSelected ? "[ACTIVE]" : "SELECT", boxX + boxWidth / 2, boxY + 95);

                        ctx.fillStyle = "#fff";
                        ctx.font = "9px monospace";
                        ctx.fillText(skin.name.split(" ")[0], boxX + boxWidth / 2, boxY + 130);
                        ctx.fillText(skin.name.split(" ")[1] || "", boxX + boxWidth / 2, boxY + 143);
                    } else {
                        ctx.fillStyle = "#333";
                        ctx.fillRect(previewCarX, previewCarY, 30, 45);
                        
                        ctx.fillStyle = "#ff0055";
                        ctx.font = "bold 10px monospace";
                        ctx.fillText("LOCKED", boxX + boxWidth / 2, boxY + 95);

                        ctx.fillStyle = "#888";
                        ctx.font = "9px monospace";
                        if (i === 2) {
                            ctx.fillText("Score 1000", boxX + boxWidth / 2, boxY + 130);
                            ctx.fillText("to unlock", boxX + boxWidth / 2, boxY + 143);
                        } else {
                            ctx.fillText("????", boxX + boxWidth / 2, boxY + 130);
                        }
                    }

                    boxX += 105;
                }

                ctx.fillStyle = "#fff";
                ctx.font = "11px monospace";
                ctx.fillText("Select Game Mode:", canvas.width / 2, 285);

                const modes = [
                    { id: "regular", label: "Regular", x: 42, w: 88 },
                    { id: "traffic", label: "Traffic", x: 134, w: 88 },
                    { id: "getaway", label: "Getaway", x: 226, w: 88 },
                    { id: "survival", label: "Survival", x: 318, w: 88 }
                ];

                for (let m of modes) {
                    let isModeSelected = (selectedGameMode === m.id);
                    ctx.fillStyle = isModeSelected ? "#222" : "#161616";
                    ctx.fillRect(m.x, 300, m.w, 35);
                    ctx.strokeStyle = isModeSelected ? "#00ff66" : "#555";
                    ctx.lineWidth = isModeSelected ? 3 : 1;
                    ctx.strokeRect(m.x, 300, m.w, 35);

                    ctx.fillStyle = isModeSelected ? "#00ff66" : "#fff";
                    ctx.font = "bold 11px monospace";
                    ctx.fillText(m.label, m.x + m.w / 2, 322);
                }

                ctx.strokeStyle = "#00ff66";
                ctx.lineWidth = 2;
                ctx.strokeRect(373, 345, 72, 150);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 9px monospace";
                ctx.fillText("MUSIC", 409, 357);

                const songButtons = [
                    { id: "synth", label: "1 SYNTH", y: 362, unlocked: true },
                    { id: "retro", label: "2 RETRO", y: 386, unlocked: song2Unlocked },
                    { id: "winter", label: "3 WINTER", y: 410, unlocked: winterUnlocked },
                    { id: "post2000", label: "4 POST2K", y: 434, unlocked: post2000Unlocked }
                ];

                for (let b of songButtons) {
                    let selected = selectedSong === b.id;
                    ctx.fillStyle = !b.unlocked ? "#0f0f0f" : (selected ? "#222" : "#161616");
                    ctx.fillRect(375, b.y, 68, 22);
                    ctx.strokeStyle = !b.unlocked ? "#333" : (selected ? "#00ff66" : "#555");
                    ctx.lineWidth = selected ? 2 : 1;
                    ctx.strokeRect(375, b.y, 68, 22);
                    ctx.fillStyle = !b.unlocked ? "#555" : (selected ? "#00ff66" : "#fff");
                    ctx.font = "bold 8px monospace";
                    ctx.fillText(!b.unlocked ? "LOCKED" : b.label, 409, b.y + 15);
                }

                ctx.fillStyle = "#fff";
                ctx.font = "bold 8px monospace";
                ctx.fillText("VOL", 409, 466);
                ctx.fillStyle = "#444";
                ctx.fillRect(377, 470, 64, 8);
                ctx.fillStyle = "#00ff66";
                ctx.fillRect(377, 470, 64 * (musicVolume / 100), 8);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1;
                ctx.strokeRect(377, 470, 64, 8);
                ctx.fillStyle = "#fff";
                ctx.font = "7px monospace";
                ctx.fillText(musicVolume + "%", 409, 490);

                ctx.fillStyle = "#fff";
                ctx.font = "11px monospace";
                ctx.fillText("Double-press P to Resume", canvas.width / 2, 368);

                let pinkSemiY = 378;
                let pinkSemiW = 335;
                ctx.fillStyle = pinkSemiUnlocked ? "#1a1a22" : "#161616";
                ctx.fillRect(30, pinkSemiY, pinkSemiW, 80);
                ctx.strokeStyle = pinkSemiUnlocked ? "#ff1493" : "#555";
                ctx.lineWidth = 1;
                ctx.strokeRect(30, pinkSemiY, pinkSemiW, 80);

                if (pinkSemiUnlocked) {
                    let scx = 30 + pinkSemiW / 2;
                    let pinkActive = (selectedCarSkin === 4);

                    let pw2 = 28, cabH = 20, trailH = 40;
                    let totalH = cabH + trailH;
                    let scpx = scx - pw2 / 2;
                    let scpy = pinkSemiY + (80 - totalH) / 2;

                    ctx.fillStyle = "#ff1493";
                    ctx.fillRect(scpx, scpy, pw2, cabH);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(scpx + 4, scpy + 6, pw2 - 8, 8);
                    ctx.fillStyle = "#0066ff";
                    ctx.fillRect(scpx + 2, scpy + 2, 4, 4);
                    ctx.fillRect(scpx + 2, scpy + 14, 4, 6);
                    ctx.fillRect(scpx + pw2 - 6, scpy + 2, 4, 4);
                    ctx.fillRect(scpx + pw2 - 6, scpy + 14, 4, 6);

                    ctx.save();
                    ctx.translate(scpx + pw2 / 2, scpy + cabH);
                    ctx.rotate(10 * Math.PI / 180);
                    ctx.fillStyle = "#aaaaaa";
                    ctx.fillRect(-pw2 / 2 + 3, 0, pw2 - 6, trailH);
                    ctx.fillStyle = "#777777";
                    ctx.fillRect(-pw2 / 2 + 3, 12, pw2 - 6, 3);
                    ctx.fillRect(-pw2 / 2 + 3, 28, pw2 - 6, 3);
                    ctx.restore();

                    ctx.fillStyle = pinkActive ? "#00ff66" : "#ff1493";
                    ctx.font = "bold 9px monospace";
                    ctx.fillText(pinkActive ? "[ACTIVE]" : "BRIGHT PINK SEMI", scx, pinkSemiY + 65);
                } else {
                    ctx.fillStyle = "#ff0055";
                    ctx.font = "bold 9px monospace";
                    ctx.fillText("????: LOCKED", 30 + pinkSemiW / 2, pinkSemiY + 48);
                }

                ctx.textAlign = "left";
            }

            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 24px monospace";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);
                if (asleepGameOver) {
                    ctx.fillStyle = "#ffcc00";
                    ctx.font = "bold 13px monospace";
                    ctx.fillText("YOU FELL ASLEEP AT THE WHEEL!", canvas.width / 2, canvas.height / 2 + 12);
                    ctx.fillStyle = "#fff";
                    ctx.font = "11px monospace";
                    ctx.fillText("PRESS Z NEXT TIME TO SLEEP SAFELY", canvas.width / 2, canvas.height / 2 + 32);
                } else {
                    ctx.fillStyle = "#fff";
                    ctx.font = "14px monospace";
                    ctx.fillText("PRESS SPACE TO RESTART", canvas.width / 2, canvas.height / 2 + 15);
                }
                ctx.textAlign = "left";
            }

            if (shake > 0) {
                ctx.restore();
                shake *= 0.88;
                if (shake < 0.5) shake = 0;
            }
        }

        function loop(t) {
            if (lastT === 0) lastT = t;
            let delta = Math.min((t - lastT) / 1000, 0.1);
            lastT = t;
            update(delta);
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
